version: '3.9'

services:
  editor:
    build:
      context: .
      dockerfile: Dockerfile
    image: occ-editor:latest
    container_name: occ-editor-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - node_modules_editor:/app/apps/editor/node_modules
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
    entrypoint: sh
    command:
      - -c
      - |
        npm ci --ignore-scripts &&
        cd apps/editor &&
        npm ci &&
        cd /app &&
        npm run dev
    networks:
      - dev-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: occ-web:latest
    container_name: occ-web-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_root_web:/app/node_modules
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    entrypoint: sh
    command:
      - -c
      - |
        npm ci --ignore-scripts &&
        cd apps/web &&
        npm ci &&
        npm run dev
    depends_on:
      - editor
    networks:
      - dev-network

volumes:
  node_modules:
    driver: local
  node_modules_editor:
    driver: local
  node_modules_web:
    driver: local
  node_modules_root_web:
    driver: local

networks:
  dev-network:
    driver: bridge