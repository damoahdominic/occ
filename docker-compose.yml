version: '3.9'

services:
  editor:
    image: openclaw/editor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: occ-editor-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - node_modules_editor:/app/apps/editor/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    command: >
      bash -c "
        npm ci --ignore-scripts &&
        cd apps/editor &&
        npm ci &&
        cd /app &&
        npm run dev
      "
    networks:
      - dev-network

volumes:
  node_modules:
    driver: local
  node_modules_editor:
    driver: local

networks:
  dev-network:
    driver: bridge