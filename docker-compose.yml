version: '3.9'

services:
  editor:
    extends:
      file: docker-compose.test.yml
      service: test-nvm
    image: occ-editor:latest
    container_name: occ-editor-dev
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
    entrypoint: sh
    command:
      - -c
      - "[ -s /root/.nvm/nvm.sh ] && . /root/.nvm/nvm.sh; npm ci --ignore-scripts && cd apps/editor && npm ci && cd /app && npm run dev"
    networks:
      dev-network: null

  web:
    extends:
      file: docker-compose.test.yml
      service: test-nvm
    image: occ-web:latest
    container_name: occ-web-dev
    working_dir: /app
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    entrypoint: sh
    command:
      - -c
      - "[ -s /root/.nvm/nvm.sh ] && . /root/.nvm/nvm.sh; npm ci --ignore-scripts && cd apps/web && npm ci && npm run dev"
    depends_on:
      - editor
    networks:
      dev-network: null

volumes:
  node_modules:
    driver: local
  node_modules_editor:
    driver: local
  node_modules_web:
    driver: local
  node_modules_root_web:
    driver: local
  node_modules_nvm:
    driver: local
  nvm_cache:
    driver: local

networks:
  dev-network:
    driver: bridge
  test-network:
    driver: bridge