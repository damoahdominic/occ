version: "3.8"

services:
  # Windows VM inside Docker (using dockur/windows)
  windows-vm:
    image: dockurr/windows
    container_name: occ-windows-vm
    environment:
      # Windows version: 11, 10, 2022, 2019, etc.
      VERSION: "11"
      # RAM and CPU settings
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      # Default credentials
      USERNAME: "occode"
      PASSWORD: "occode123"
      # Language and keyboard
      LANGUAGE: "English"
      KEYBOARD: "en-US"
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"    # Web viewer
      - "3389:3389/tcp"  # RDP
      - "3389:3389/udp"
    volumes:
      - ./docker/windows-storage:/storage
      - ./docker/windows-shared:/shared
    restart: unless-stopped
    stop_grace_period: 2m

networks:
  dev-network:
    driver: bridge