# Windows 11 VM for Cross-Platform Testing
#
# PURPOSE:
#   Windows 11 virtual machine for cross-platform testing, Windows-specific
#   builds, and UI testing scenarios. Specialized use case only.
#
# USAGE:
#   docker-compose -f docker-compose.windows.yml up -d
#   docker-compose -f docker-compose.windows.yml logs -f windows-vm
#   docker-compose -f docker-compose.windows.yml down
#
# SERVICES:
#   - windows-vm : Windows 11 VM with hardware acceleration (KVM)
#
# PORTS:
#   - 8006 : Web viewer for VM display
#   - 3389 : RDP (Remote Desktop Protocol) access
#
# DEVICES & CAPABILITIES:
#   - /dev/kvm        : Hardware acceleration for virtualization
#   - /dev/net/tun    : Network acceleration
#   - CAP_NET_ADMIN   : Network administration capability
#
# VOLUMES:
#   - ./docker/windows-storage : VM persistent storage
#   - ./docker/windows-shared   : Shared data directory
#
# REQUIREMENTS:
#   - KVM support (nested virtualization or Linux host)
#   - Sufficient RAM and CPU (configurable via environment)
#   - These commands require sudo or docker group access
#
# NOTES:
#   - Completely separate from OpenClaw and editor services
#   - Resource-intensive; only run when needed
#   - Restart grace period: 2 minutes
#
# See DOCKER.md for detailed configuration and usage.

version: "3.8"

services:
  # Windows VM inside Docker (using dockur/windows)
  windows-vm:
    image: dockurr/windows
    container_name: occ-windows-vm
    environment:
      # Windows version: 11, 10, 2022, 2019, etc.
      VERSION: "11"
      # RAM and CPU settings
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      # Default credentials
      USERNAME: "occode"
      PASSWORD: "occode123"
      # Language and keyboard
      LANGUAGE: "English"
      KEYBOARD: "en-US"
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"    # Web viewer
      - "3389:3389/tcp"  # RDP
      - "3389:3389/udp"
    volumes:
      - ./docker/windows-storage:/storage
      - ./docker/windows-shared:/shared
    restart: unless-stopped
    stop_grace_period: 2m

networks:
  dev-network:
    driver: bridge