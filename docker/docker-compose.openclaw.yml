version: "3.9"

services:
  occ-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.openclaw
    image: openclaw/pod:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    environment:
      DATABASE_URL: postgresql://openclaw:occdev@occ-postgres:5432/openclaw
      REDIS_URL: redis://occ-redis:6379
      GATEWAY_PORT: "18789"
    volumes:
      - ${OPENCLAW_DATA_DIR}:/root/.openclaw
    networks:
      - occ-network
    depends_on:
      occ-postgres:
        condition: service_healthy
      occ-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:18789/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  occ-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: occdev
      POSTGRES_DB: openclaw
      POSTGRES_USER: openclaw
    volumes:
      - occ-postgres-data:/var/lib/postgresql/data
    networks:
      - occ-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw"]
      interval: 5s
      timeout: 3s
      retries: 5

  occ-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - occ-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  occ-network:
    driver: bridge

volumes:
  occ-openclaw-data:
  occ-postgres-data:
