name: Build macOS & Windows

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci-test'
  workflow_dispatch:

jobs:
  build-macos:
    # Available runners as of March 2026:
    #   Retired: macos-11 (2024), macos-12 (Jan 2025), macos-13 (Dec 2025)
    #   Active:  macos-14 (arm64), macos-15 (arm64), macos-26 (arm64, GA Feb 2026)
    #            macos-15-intel / macos-26-intel for x64 (replaces retired macos-13)
    # macos-14 deprecation begins July 2026 — remove that entry then.
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 (Intel) builds — macos-13 retired; use -intel variants
          - runner: macos-15-intel
            arch: x64
            make_target: build-macos-x64
            vscode_arch: x64
            output_dir: VSCode-darwin-x64
            artifact_name: darwin-x64-macos15
          - runner: macos-26-intel
            arch: x64
            make_target: build-macos-x64
            vscode_arch: x64
            output_dir: VSCode-darwin-x64
            artifact_name: darwin-x64-macos26
          # arm64 (Apple Silicon) builds
          - runner: macos-14
            arch: arm64
            make_target: build-macos-arm64
            vscode_arch: arm64
            output_dir: VSCode-darwin-arm64
            artifact_name: darwin-arm64-macos14
          - runner: macos-15
            arch: arm64
            make_target: build-macos-arm64
            vscode_arch: arm64
            output_dir: VSCode-darwin-arm64
            artifact_name: darwin-arm64-macos15
          - runner: macos-26
            arch: arm64
            make_target: build-macos-arm64
            vscode_arch: arm64
            output_dir: VSCode-darwin-arm64
            artifact_name: darwin-arm64-macos26

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      P12_CHECK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      API_KEY_CHECK: ${{ secrets.APPLE_API_KEY_P8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.18.2'
          cache: 'npm'
          cache-dependency-path: |
            apps/editor/package-lock.json
            apps/editor/build/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            apps/editor/node_modules
            apps/editor/build/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/editor/package-lock.json', 'apps/editor/build/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron gyp headers
        uses: actions/cache@v4
        with:
          path: ~/.electron-gyp
          key: electron-gyp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/editor/package.json') }}

      - name: Stamp release version in product.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/editor
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('product.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME;
            const sha = process.env.GITHUB_SHA ? process.env.GITHUB_SHA.slice(0, 7) : tag;
            p.occRelease = tag;
            p.voidVersion = tag;
            p.commit = sha;
            p.date = new Date().toISOString();
            fs.writeFileSync('product.json', JSON.stringify(p, null, '\t'));
            console.log('Stamped version =>', tag, 'commit =>', sha);
          "

      - name: Build macOS (${{ matrix.arch }})
        run: make ${{ matrix.make_target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=7168
          CI_DEPS_READY: ${{ steps.cache-node-modules.outputs.cache-hit }}

      - name: Import certificate to keychain
        if: ${{ env.P12_CHECK != '' }}
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # sign.js looks for buildagent.keychain at AGENT_TEMPDIRECTORY
          KEYCHAIN_PATH=$RUNNER_TEMP/buildagent.keychain
          CERT_PATH=$RUNNER_TEMP/developer-id.p12

          echo "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "keychain-password" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "keychain-password" "$KEYCHAIN_PATH"

      - name: Sign app
        if: ${{ env.P12_CHECK != '' }}
        env:
          CODESIGN_IDENTITY: "Developer ID Application: HITL, Inc (SQZ9VHYXJ3)"
          AGENT_BUILDDIRECTORY: ${{ github.workspace }}/apps
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          VSCODE_ARCH: ${{ matrix.vscode_arch }}
        working-directory: apps/editor
        run: node build/darwin/sign.js "$GITHUB_WORKSPACE/apps"

      - name: Zip signed app
        run: |
          cd "$GITHUB_WORKSPACE/apps/${{ matrix.output_dir }}"
          zip -Xry "$RUNNER_TEMP/OCcode-${{ matrix.artifact_name }}-${GITHUB_REF_NAME}.zip" "OCcode.app"

      - name: Notarize
        if: ${{ env.P12_CHECK != '' && env.API_KEY_CHECK != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          xcrun notarytool submit "$RUNNER_TEMP/OCcode-${{ matrix.artifact_name }}-${GITHUB_REF_NAME}.zip" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER" \
            --wait \
            --timeout 30m

      - name: Staple notarization ticket
        if: ${{ env.P12_CHECK != '' && env.API_KEY_CHECK != '' }}
        run: |
          xcrun stapler staple "$GITHUB_WORKSPACE/apps/${{ matrix.output_dir }}/OCcode.app"

      - name: Re-zip stapled app
        if: ${{ env.P12_CHECK != '' && env.API_KEY_CHECK != '' }}
        run: |
          cd "$GITHUB_WORKSPACE/apps/${{ matrix.output_dir }}"
          zip -Xry "$RUNNER_TEMP/OCcode-${{ matrix.artifact_name }}-${GITHUB_REF_NAME}-signed.zip" "OCcode.app"

      - name: Verify signature
        if: ${{ env.P12_CHECK != '' }}
        run: |
          codesign -dv --deep --verbose=4 "$GITHUB_WORKSPACE/apps/${{ matrix.output_dir }}/OCcode.app" 2>&1
          spctl -a -vvv -t install "$GITHUB_WORKSPACE/apps/${{ matrix.output_dir }}/OCcode.app" 2>&1

      - name: Upload app artifact (signed or unsigned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true
        with:
          name: OCcode-${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/OCcode-${{ matrix.artifact_name }}-${{ github.ref_name }}-signed.zip
            ${{ runner.temp }}/OCcode-${{ matrix.artifact_name }}-${{ github.ref_name }}.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        continue-on-error: true
        with:
          files: |
            ${{ runner.temp }}/OCcode-${{ matrix.artifact_name }}-${{ github.ref_name }}-signed.zip
            ${{ runner.temp }}/OCcode-${{ matrix.artifact_name }}-${{ github.ref_name }}.zip
          name: OCcode ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      AZURE_CLIENT_ID_CHECK: ${{ secrets.AZURE_CLIENT_ID }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.18.2'
          cache: 'npm'
          cache-dependency-path: |
            apps/editor/package-lock.json
            apps/editor/build/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            apps/editor/node_modules
            apps/editor/build/node_modules
          key: node-modules-${{ runner.os }}-x64-${{ hashFiles('apps/editor/package-lock.json', 'apps/editor/build/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-x64-

      - name: Cache Electron gyp headers
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/electron-gyp
          key: electron-gyp-${{ runner.os }}-x64-${{ hashFiles('apps/editor/package.json') }}

      - name: Stamp release version in product.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/editor
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('product.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME;
            const sha = process.env.GITHUB_SHA ? process.env.GITHUB_SHA.slice(0, 7) : tag;
            p.occRelease = tag;
            p.voidVersion = tag;
            p.commit = sha;
            p.date = new Date().toISOString();
            fs.writeFileSync('product.json', JSON.stringify(p, null, '\t'));
            console.log('Stamped version =>', tag, 'commit =>', sha);
          "

      - name: Build Windows
        run: make build-windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_DEPS_READY: ${{ steps.cache-node-modules.outputs.cache-hit }}

      - name: Sign Windows installers (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID_CHECK != '' }}
        uses: azure/trusted-signing-action@87c2e83e6868da99d3380aa309851b32ed9a8346
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: apps/editor/.build/win32-x64
          files-folder-filter: "**/*.exe"
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip portable app
        shell: pwsh
        run: |
          $appDir = "$env:GITHUB_WORKSPACE\apps\VSCode-win32-x64"
          $outZip = "$env:RUNNER_TEMP\OCcode-win32-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "$appDir\*" -DestinationPath $outZip

      - name: Collect installer paths
        id: paths
        run: |
          BUILD=apps/editor/.build/win32-x64
          echo "system_setup=$(ls $BUILD/system-setup/VSCodeSetup.exe)" >> $GITHUB_OUTPUT
          echo "user_setup=$(ls $BUILD/user-setup/VSCodeSetup.exe)" >> $GITHUB_OUTPUT

      - name: Rename installers for release
        run: |
          cp apps/editor/.build/win32-x64/system-setup/VSCodeSetup.exe \
             "$RUNNER_TEMP/OCcode-win32-x64-${GITHUB_REF_NAME}-system-setup.exe"
          cp apps/editor/.build/win32-x64/user-setup/VSCodeSetup.exe \
             "$RUNNER_TEMP/OCcode-win32-x64-${GITHUB_REF_NAME}-user-setup.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true
        with:
          name: OCcode-win32-x64-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/OCcode-win32-x64-${{ github.ref_name }}-system-setup.exe
            ${{ runner.temp }}/OCcode-win32-x64-${{ github.ref_name }}-user-setup.exe
            ${{ runner.temp }}/OCcode-win32-x64-${{ github.ref_name }}.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            ${{ runner.temp }}/OCcode-win32-x64-${{ github.ref_name }}-system-setup.exe
            ${{ runner.temp }}/OCcode-win32-x64-${{ github.ref_name }}-user-setup.exe
            ${{ runner.temp }}/OCcode-win32-x64-${{ github.ref_name }}.zip
          name: OCcode ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.18.2'
          cache: 'npm'
          cache-dependency-path: apps/editor/package-lock.json

      - name: Stamp release version in product.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/editor
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('product.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME;
            const sha = process.env.GITHUB_SHA ? process.env.GITHUB_SHA.slice(0, 7) : tag;
            p.occRelease = tag;
            p.voidVersion = tag;
            p.commit = sha;
            p.date = new Date().toISOString();
            fs.writeFileSync('product.json', JSON.stringify(p, null, '\t'));
            console.log('Stamped version =>', tag, 'commit =>', sha);
          "

      - name: Build Linux (container)
        run: make container-build-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .tar.gz (universal Linux)
        run: |
          tar -czf "$RUNNER_TEMP/OCcode-linux-x64-${GITHUB_REF_NAME}.tar.gz" \
            -C apps VSCode-linux-x64

      - name: Collect .deb and copy to temp
        run: |
          DEB=$(ls apps/editor/.build/linux/deb/amd64/deb/*.deb)
          cp "$DEB" "$RUNNER_TEMP/OCcode-linux-x64-${GITHUB_REF_NAME}.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true
        with:
          name: OCcode-linux-x64-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/OCcode-linux-x64-${{ github.ref_name }}.deb
            ${{ runner.temp }}/OCcode-linux-x64-${{ github.ref_name }}.tar.gz
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          files: |
            ${{ runner.temp }}/OCcode-linux-x64-${{ github.ref_name }}.deb
            ${{ runner.temp }}/OCcode-linux-x64-${{ github.ref_name }}.tar.gz
          name: OCcode ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
